name: Build and validate Kingroon profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build native offline repository
        run: python tools/build.py --base-url https://bublinak.github.io/KP3S-PrusaSlicer/
      - name: Download the reference PrusaSlicer build
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/prusa3d/PrusaSlicer/releases/download/version_3.0.0-alpha12/PrusaSlicer-3.0.0-alpha12.zip' -OutFile "$env:RUNNER_TEMP/slicer.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/slicer.zip" -DestinationPath "$env:RUNNER_TEMP/slicer"
          $slicerExe = Get-ChildItem "$env:RUNNER_TEMP/slicer" -Filter PrusaSlicer.exe -Recurse | Select-Object -First 1
          if (-not $slicerExe) { throw 'PrusaSlicer.exe was not found in the release ZIP' }
          "SLICER_EXE=$($slicerExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify archive, install it and slice every hardware variant
        shell: pwsh
        run: python tools/validate.py --slicer "$env:SLICER_EXE"
      - name: Upload installable profiles and migration report
        uses: actions/upload-artifact@v4
        with:
          name: kingroon-prusaslicer3
          path: |
            dist/kingroon-fff.zip
            dist/migration-report.json
            .validation/summary.json
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kingroon-validation-logs
          path: .validation/
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy validated downloads
        id: deployment
        uses: actions/deploy-pages@v4
